<header class="top">
  <div class="brand">
    <span class="brand-name">Water Saver</span>
    <span class="brand-sub">Colorado Rural Water · Pilot</span>
  </div>
  <nav class="nav" aria-label="Primary">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/upload" routerLinkActive="active">Upload</a>
    <a routerLink="/sources" routerLinkActive="active">Sources</a>
    <a routerLink="/alerts" routerLinkActive="active">Alerts</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/account" routerLinkActive="active">Account</a>
    }
    @if (auth.canManageUsers()) {
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
    }
    @if (auth.isSystemAdmin()) {
      <a routerLink="/billing" routerLinkActive="active">Billing</a>
    }
    @if (auth.isCrwaAdmin()) {
      <a routerLink="/crwa" routerLinkActive="active">CRWA</a>
    }
  </nav>
  <div class="auth">
    @if (auth.isLoggedIn()) {
      <span class="auth-email">{{ auth.email() }}</span>
      <button type="button" class="auth-btn" (click)="logout()">Sign out</button>
    } @else {
      <a routerLink="/login" class="auth-link">Sign in</a>
    }
  </div>
</header>
<main class="main">
  <router-outlet />
</main>
