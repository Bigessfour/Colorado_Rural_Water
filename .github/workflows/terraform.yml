name: Terraform

# Conditional: plan on PR, apply on main (Feature 006).
# Code Platoon account via GitHub Secrets — never hard-code keys.
# Resources must be tagged Assessment-iii (Terraform default_tags).

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: infra/terraform

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
        continue-on-error: true
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
      - name: Terraform init
        run: terraform init -input=false
        continue-on-error: true
      - name: Terraform validate
        run: terraform validate -no-color
        continue-on-error: true
      - name: Terraform plan
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file=environments/dev.tfvars.example -no-color -input=false
        continue-on-error: true

  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Bundle Lambdas
        working-directory: .
        run: npm ci && npm run backend:bundle
        continue-on-error: true
      - name: Terraform init + apply
        run: |
          terraform init -input=false
          terraform workspace select dev || terraform workspace new dev
          terraform apply -var-file=environments/dev.tfvars.example -auto-approve -input=false
        continue-on-error: true
