name: Terraform Plan

# Feature 006 — plan on PR or manual workflow_dispatch (safe; no mutations).
# Account 388691194728 · Assessment-iii tag.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
      - "backend/src/**"
      - "scripts/build-lambda-zip.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_VAR_FILE: environments/ci.tfvars.example

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Guard account
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "Caller account=${ACCOUNT}"
          test "${ACCOUNT}" = "388691194728"
      - name: Bundle Lambdas (plan needs zip hash)
        working-directory: .
        run: |
          npm ci
          npm --prefix backend ci
          npm run backend:bundle
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform validate
        run: terraform validate -no-color
      - name: Terraform plan
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file="${TF_VAR_FILE}" -no-color -input=false
