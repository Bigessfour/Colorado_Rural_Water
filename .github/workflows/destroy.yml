name: Destroy

# Feature 006 — explicit teardown. Prefer dry_run=true for evidence without deleting the stack.
# Account: 388691194728 · us-east-1 · tag Assessment-iii

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy to confirm"
        required: true
        type: string
      dry_run:
        description: "If true, only terraform plan -destroy (safe evidence)"
        required: true
        type: boolean
        default: true

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm == 'destroy'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.10"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Bundle Lambdas
        run: |
          npm ci
          npm --prefix backend ci
          npm run backend:bundle
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false
      - name: Terraform plan -destroy (dry run)
        if: inputs.dry_run
        working-directory: infra/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -destroy \
            -var-file=environments/ci.tfvars.example \
            -no-color -input=false
      - name: Terraform destroy (real)
        if: ${{ !inputs.dry_run }}
        working-directory: infra/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform destroy \
            -var-file=environments/ci.tfvars.example \
            -auto-approve -no-color -input=false
      - name: Evidence note
        run: |
          mkdir -p evidence
          {
            echo "- $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }} dry_run=${{ inputs.dry_run }} actor=${{ github.actor }}"
          } >> evidence/07-destroy.md
