name: Destroy

# Feature 006 — explicit teardown. Prefer dry_run=true for evidence without deleting the stack.
# Account: 388691194728 · us-east-1 · tag Assessment-iii

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy to confirm"
        required: true
        type: string
      dry_run:
        description: "If true, only terraform plan -destroy (safe evidence)"
        required: true
        type: boolean
        default: true

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm == 'destroy'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Bundle Lambdas
        run: npm ci && npm run backend:bundle
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false
      - name: Terraform plan -destroy (dry run)
        if: inputs.dry_run
        working-directory: infra/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -destroy \
            -var-file=environments/ci.tfvars.example \
            -no-color -input=false
      - name: Terraform destroy (real)
        if: ${{ !inputs.dry_run }}
        working-directory: infra/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform destroy \
            -var-file=environments/ci.tfvars.example \
            -auto-approve -no-color -input=false
      - name: Evidence note
        run: |
          mkdir -p evidence
          {
            echo "- $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }} dry_run=${{ inputs.dry_run }} actor=${{ github.actor }}"
          } >> evidence/07-destroy.md
