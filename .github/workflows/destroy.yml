name: Destroy

# Feature 006 — explicit teardown. Type confirm=destroy to run.
# Account: 388691194728 / codeplatoon / us-east-1 · tag Assessment-iii

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy to confirm teardown"
        required: true
        type: string

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm == 'destroy'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false
      - name: Terraform Destroy
        working-directory: infra/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform destroy \
            -var-file=environments/dev.tfvars.example \
            -auto-approve -no-color -input=false
      - name: Evidence note
        run: |
          mkdir -p evidence
          echo "Destroy completed at $(date -u +%Y-%m-%dT%H:%M:%SZ) on ${{ github.run_id }} (codeplatoon)" >> evidence/07-destroy.md
