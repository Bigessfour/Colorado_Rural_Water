name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "scripts/smoke.sh"
      - "scripts/ci-local.sh"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "scripts/smoke.sh"
      - "scripts/ci-local.sh"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-node:
    name: backend node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Run node tests
        working-directory: backend
        run: npm test

  pytest:
    name: pytest (RAG isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python deps
        run: pip install -r backend/requirements.txt
      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -q --tb=short

  compose:
    name: docker compose build
    runs-on: ubuntu-latest
    env:
      # Optional — compose substitutes these into the backend service
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      # Required by compose (no hardcoded default — avoids secret scanners)
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: app
      POSTGRES_DB: water_saver
    steps:
      - uses: actions/checkout@v4
      - name: Compose config check
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Up + health smoke
        run: |
          # Wait on service healthchecks instead of a fixed sleep
          docker compose up -d --wait --wait-timeout 180
          SMOKE_FRONTEND_URL=http://127.0.0.1:8080 ./scripts/smoke.sh http://127.0.0.1:3000
          docker compose down -v
